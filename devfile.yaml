schemaVersion: 2.2.0
metadata:
  name: java-grundlagen
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      memoryRequest: 1Gi
      memoryLimit: 2Gi
      cpuRequest: 250m
      cpuLimit: "1"
      mountSources: true
commands:
#  DO NOT INSTALL EXTENSIONS BEFORE VSCODE SHOWS UP, BUT INSTALL THEM AUTOMATICALLY AFTER STARTUP
#  - id: install-vscode-extensions
#    exec:
#      component: tools
#      commandLine: nohup bash "$PROJECT_SOURCE/.che/install-extensions.sh" > /tmp/install-extensions.log 2>&1 &
  - id: configure-vscode
    exec:
      component: tools
      commandLine: bash "$PROJECT_SOURCE/.che/init-vscode-settings.sh"
  - id: configure-git
    exec:
      component: tools
      commandLine: bash "$PROJECT_SOURCE/.che/init-git.sh"
events:
  postStart:
#    - install-vscode-extensions
    - configure-vscode
    - configure-git
